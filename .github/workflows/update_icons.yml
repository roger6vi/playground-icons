name: Sincronizar Iconos de Figma
run-name: Actualizando iconos desde Figma 🎨

on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figma-export:
    runs-on: macos-latest
    
    steps:
      # 1. Bajamos el código
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # 2. Instalamos la herramienta MANUALMENTE (Más estable que Brew)
      - name: 🛠 Instalar figma-export
        run: |
          # Descargar la última versión oficial
          curl -LO https://github.com/RedMadRobot/figma-export/releases/latest/download/figma-export.zip
          
          # Descomprimir en una carpeta llamada 'tool'
          unzip figma-export.zip -d tool
          
          # Dar permisos de ejecución
          chmod +x tool/figma-export
          
          # Verificar que funciona
          ./tool/figma-export --version

      # 3. Ejecutamos la exportación
      # Usamos ./tool/ delante para decirle dónde está la herramienta
      - name: 🚀 Generar iconos
        run: ./tool/figma-export icons

      # 4. Commit y Push de los cambios
      - name: 💾 Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎨 Diseño: Iconos actualizados automáticamente desde Figma"
          branch: main
          file_pattern: '.'
