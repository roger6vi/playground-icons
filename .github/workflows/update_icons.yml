name: Sincronizar Iconos de Figma
run-name: Actualizando iconos desde Figma 🎨

# Activación manual (botón) para que lo lances cuando quieras
on: 
  workflow_dispatch:

# Permisos explícitos para poder hacer "git push"
permissions:
  contents: write

jobs:
  figma-export:
    runs-on: macos-latest
    
    steps:
      # 1. Bajamos el código
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # 2. Instalamos la herramienta
      - name: 🛠 Instalar figma-export
        run: |
          brew install redmadrobot/tap/figma-export
          figma-export --version

      # 3. Ejecutamos la exportación
      # Al no pasar variables, buscará el token en tu figma-export.yaml
      - name: 🚀 Generar iconos
        run: figma-export icons

      # 4. Commit y Push de los cambios
      - name: 💾 Guardar cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎨 Diseño: Iconos actualizados automáticamente desde Figma"
          branch: main
          file_pattern: '.' # Agrega todos los archivos modificados